<html>
    <head>
        <title>Arithmetic</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <script src="arithmetic.js"></script>
        <style type="text/css">
            body {
                font-size:20px;
                font-family:sans-serif;
            }
            input[type=number], input[type=text], select {
                width:50px;
                font-family: sans-serif;
                text-align:right;
                font-size:20px;
            }
            input[type=button] {
                font-size:20px;
                width:170px;
            }
            #wrapper {
                margin:auto;
                width:380px;
                background-color:rgb(227, 205, 255);
                padding:10px;
                padding-top:0px;
            }

            #header{
                margin: auto;
                text-align: center;
            }

        </style>
    </head>
    <body>
        <div id='wrapper'>
            <header>
                <h1 id = "header">I ❤ Arithmetic...</h1>
            </header>
            <form>
                <input id = 'input1' type="number" value="2" onchange = "when_clicked()" oninput = "when_clicked()"> 
                <select id="operation" onchange = "when_clicked()" oninput = "when_clicked()">
                    <option>+</option>
                    <option>-</option>
                    <option>*</option>
                    <option>/</option>
                    <option>%</option>
                </select>
                <input id = 'input2' type="number" value="2" onchange = "when_clicked()" oninput = "when_clicked()"> =
                <input id = 'answer_box' type='text' readonly><br>
            </form>
        </div>
    </body>
</html>
